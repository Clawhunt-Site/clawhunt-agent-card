<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3f7ff5">
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<title>ClawHunt 碰一下</title>
<style>
:root{
  --paper:#f5fbfc; --white:#fff; --ink:#0e1c2c; --slate:#4f6477; --muted:#7c8c9c;
  --blue:#3f7ff5; --blue-deep:#2496df; --teal:#10b6a6; --mint:#c6fdf1; --mist:#e6f7f4; --aqua:#e5f8fb;
  --line:#cfe6e8; --danger:#c2413b;
  --signal:linear-gradient(135deg,var(--blue) 0%,var(--blue-deep) 52%,var(--teal) 100%);
  --night:linear-gradient(150deg,var(--ink) 0%,#17538f 52%,var(--teal) 100%);
  --fresh:linear-gradient(165deg,var(--teal) 0%,#5fd9c8 48%,var(--mint) 100%);
  --dusk:linear-gradient(160deg,#33475b 0%,var(--slate) 55%,#8ea0b0 100%);
  --shadow:0 18px 55px rgba(25,73,89,.14);
  --body:Inter,"Avenir Next","Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--paper)}
body{min-height:100dvh;color:var(--ink);font:16px/1.5 var(--body);display:grid;justify-items:center;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* one full-screen colour field per state; they cross-fade */
.field{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .4s ease;pointer-events:none}
.field.night{background:var(--night)}.field.fresh{background:var(--fresh)}.field.dusk{background:var(--dusk)}
body[data-state="waiting"] .field.night,body[data-state="paid"] .field.fresh,body[data-state="failed"] .field.dusk{opacity:1}
main{position:relative;z-index:1;width:100%;max-width:440px;display:grid;gap:16px;align-content:start}
main>section,main>p{margin:0 16px}

/* who is being charged: the brand's signal band */
.hero{background:var(--signal);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 26px 26px;display:grid;gap:14px;box-shadow:var(--shadow);transition:opacity .3s}
body:not([data-state="entry"]) .hero{opacity:0;height:0;padding:0;overflow:hidden;box-shadow:none}
.who{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.who .mark{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center}
.who img{width:40px}
.who h1{font-size:20px;font-weight:700;line-height:1.2;word-break:break-all}
.who p{font-size:13px;opacity:.86}
.live{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--mint);color:#0a5c54;white-space:nowrap}
.live.off{background:rgba(255,255,255,.22);color:#fff}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.proof div{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 12px}
.proof dt{font-size:12px;opacity:.86}
.proof dd{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}

/* entry */
.amount{text-align:center;padding:4px 0 0}
.amount small{display:block;font-size:13px;color:var(--slate)}
.amount output{display:block;font-size:64px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:var(--signal);-webkit-background-clip:text;background-clip:text;color:transparent}
.amount output.empty{background:none;color:var(--line)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:grid;gap:4px;font-size:12px;color:var(--slate)}
.fields input{font:inherit;font-size:15px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:26px;background:var(--aqua)}
.pad button{height:52px;border-radius:14px;background:var(--white);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 rgba(14,28,44,.06)}
.pad button:active{background:var(--mint)}
.pad button:last-child{background:var(--mint);color:#0a5c54}
.go{height:58px;width:100%;border-radius:18px;background:var(--ink);color:var(--mint);font-size:18px;font-weight:700;box-shadow:var(--shadow)}
.go:disabled{background:var(--line);color:#fff;box-shadow:none;cursor:default}
.hint{font-size:13px;color:var(--slate);text-align:center;min-height:1.5em}
.hint.bad{color:var(--danger);font-weight:600}

/* waiting and result */
.stage{display:grid;justify-items:center;gap:14px;padding-top:calc(34px + env(safe-area-inset-top));text-align:center;color:#fff}
body[data-state="paid"] .stage{color:var(--ink)}
.ring{position:relative;width:220px;height:220px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .track{stroke:rgba(255,255,255,.22)}
.ring .time{stroke:var(--mint);stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:0}
.waiting .time{animation:drain var(--ttl,30s) linear forwards}
@keyframes drain{to{stroke-dashoffset:578}}
.pulse{position:absolute;inset:26px;border-radius:50%;border:2px solid var(--mint);opacity:0}
.waiting .pulse{animation:pulse 2.2s ease-out infinite}
.waiting .pulse+.pulse{animation-delay:1.1s}
@keyframes pulse{from{transform:scale(.72);opacity:.6}to{transform:scale(1.2);opacity:0}}
.core{position:relative;display:grid;place-items:center;width:132px;height:132px;border-radius:50%;background:var(--white);box-shadow:0 18px 55px rgba(0,0,0,.18)}
.core img{width:76px}
.core svg{position:static;transform:none;width:74px;height:74px}
.core path{fill:none;stroke:var(--teal);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .45s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.paid .ring .track{stroke:rgba(255,255,255,.4)}
.paid .time{stroke:#fff}
.failed .time{stroke:rgba(255,255,255,.35)}
.failed .core{font-size:44px;font-weight:700;color:var(--slate)}
.stage h2{font-size:24px;font-weight:700}
.stage .sum{font-size:46px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stage p{font-size:15px;max-width:19em;opacity:.92}
.match{display:grid;gap:2px;justify-items:center;background:var(--mint);color:var(--ink);border-radius:18px;padding:10px 22px}
.match small{font-size:12px;color:#0a5c54}
.match b{font-size:34px;line-height:1;letter-spacing:.16em;font-variant-numeric:tabular-nums}
.receipt{width:100%;font-size:14px;background:var(--white);border-radius:18px;padding:4px 16px;box-shadow:var(--shadow);color:var(--ink)}
.receipt div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.receipt div:last-child{border-bottom:0}
.receipt dt{color:var(--muted)}
.receipt dd{font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.again{height:52px;width:100%;border-radius:18px;background:var(--white);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.note{font-size:12px;color:var(--muted);text-align:center}
body:not([data-state="entry"]) .note{color:rgba(255,255,255,.8)}
body[data-state="paid"] .note{color:#0a5c54}
@media (prefers-reduced-motion:reduce){.field{transition:none}.waiting .pulse{animation:none}.core path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body data-state="entry">
<div class="field night"></div><div class="field fresh"></div><div class="field dusk"></div>
<main>
  <header class="hero">
    <div class="who">
      <span class="mark"><img src="/assets/brand/clawhunt-mark-bluegreen.webp" alt="ClawHunt"></span>
      <div><h1 id="name">…</h1><p id="meta">正在读取这张卡</p></div>
      <span class="live off" id="live">离线</span>
    </div>
    <dl class="proof">
      <div><dt>成交</dt><dd id="deals">-</dd></div>
      <div><dt>成功率</dt><dd id="rate">-</dd></div>
      <div><dt>已结算</dt><dd id="settled">-</dd></div>
    </dl>
  </header>

  <section id="entry" aria-label="输入收款金额">
    <div style="display:grid;gap:14px">
      <div class="amount"><small>向这张卡收款（美元）</small><output id="shown" class="empty">$0</output></div>
      <div class="fields">
        <label>收款方<input id="payee" maxlength="12" autocomplete="organization" placeholder="你的店名"></label>
        <label>备注<input id="memo" maxlength="20" placeholder="买的什么"></label>
      </div>
      <div class="pad" id="pad"></div>
      <button class="go" id="go" disabled>发到卡上确认</button>
      <p class="hint" id="hint"></p>
    </div>
  </section>

  <section id="stage" class="stage" hidden aria-live="polite">
    <div class="ring">
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <circle class="track" cx="110" cy="110" r="92"/><circle class="time" cx="110" cy="110" r="92"/>
      </svg>
      <span class="pulse"></span><span class="pulse"></span>
      <div class="core" id="core"></div>
    </div>
    <h2 id="title"></h2>
    <div class="sum" id="sum"></div>
    <div class="match" id="match" hidden><small>核对码，卡上应显示同一个</small><b id="code"></b></div>
    <p id="detail"></p>
    <dl class="receipt" id="receipt" hidden></dl>
    <button class="again" id="again" hidden>再收一笔</button>
  </section>

  <p class="note" id="note">试运行：持卡人在卡上确认后会留下记录，但不会扣款，也不会给你转钱。</p>
</main>

<script>
const $ = id => document.getElementById(id);
const money = cents => '$' + (cents / 100).toFixed(2);
const cardId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
let digits = '';
let card = null;

function drawPad() {
  ['1','2','3','4','5','6','7','8','9','.','0','⌫'].forEach(key => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = key;
    button.setAttribute('aria-label', key === '⌫' ? '删除' : key);
    button.addEventListener('click', () => press(key));
    $('pad').append(button);
  });
}

function press(key) {
  if (key === '⌫') digits = digits.slice(0, -1);
  else if (key === '.') { if (!digits.includes('.')) digits = (digits || '0') + '.'; }
  else if (digits.includes('.') ? digits.split('.')[1].length < 2 : digits.replace(/^0+/, '').length < 4) {
    digits = digits === '0' ? key : digits + key;
  }
  refresh();
}

function cents() { return Math.round(parseFloat(digits || '0') * 100); }

function refresh() {
  $('shown').textContent = '$' + (digits || '0');
  $('shown').classList.toggle('empty', !digits);
  let problem = '';
  if (!card) problem = '找不到这张卡';
  else if (!card.online) problem = '卡现在不在线，请让持卡人连上网络';
  else if (cents() > card.limits.per_payment_cents) problem = `单笔最多 ${money(card.limits.per_payment_cents)}`;
  const payeeMissing = !$('payee').value.trim();
  $('go').disabled = Boolean(problem) || cents() <= 0 || payeeMissing;
  $('hint').textContent = problem || (cents() > 0 && payeeMissing ? '写一下收款方是谁' : '持卡人在卡上按 OK 之前，什么都不会发生');
  $('hint').classList.toggle('bad', Boolean(problem));
}

async function load() {
  try {
    const response = await fetch('/api/cards/' + encodeURIComponent(cardId));
    card = response.ok ? await response.json() : null;
  } catch (error) { card = null; }
  if (card) {
    $('name').textContent = card.agent.name;
    $('meta').textContent = `ClawHunt agent #${card.agent.id}，等级 ${card.agent.level}`;
    $('deals').textContent = card.agent.total_tasks_completed;
    $('rate').textContent = Math.round(card.agent.success_rate * 100) + '%';
    $('settled').textContent = card.agent.settled_total;
    $('live').textContent = card.online ? '卡在线' : '离线';
    $('live').classList.toggle('off', !card.online);
  } else {
    $('name').textContent = '找不到这张卡';
    $('meta').textContent = '链接可能写错了，或卡已被主人停用';
  }
  refresh();
}

function stage(kind, title, sum, detail, code) {
  document.body.dataset.state = kind;
  $('entry').hidden = true;
  $('stage').hidden = false;
  $('stage').className = 'stage ' + kind;
  $('title').textContent = title;
  $('sum').textContent = sum;
  $('detail').textContent = detail;
  $('match').hidden = !code;
  $('code').textContent = code || '';
  const core = $('core');
  core.replaceChildren();
  if (kind === 'waiting') {
    const mark = document.createElement('img');
    mark.src = '/assets/brand/clawhunt-mark-bluegreen.webp'; mark.alt = '';
    core.append(mark);
  } else if (kind === 'paid') {
    core.innerHTML = '<svg viewBox="0 0 74 74" aria-hidden="true"><path d="M17 39 L32 53 L58 23"/></svg>';
  } else {
    core.textContent = '×';
  }
  $('again').hidden = kind === 'waiting';
  if (kind !== 'paid') $('receipt').hidden = true;
}

function receipt(rows) {
  $('receipt').replaceChildren(...rows.map(([label, value]) => {
    const row = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = label; dd.textContent = value;
    row.append(dt, dd);
    return row;
  }));
  $('receipt').hidden = false;
}

const FAILURES = {
  declined: ['持卡人没付', '对方在卡上拒绝了这一笔。'],
  timeout: ['没有人确认', '卡上没有按键，这一笔已作废。'],
  expired: ['没有人确认', '这一笔已过期作废。'],
  busy: ['卡正忙', '卡上正在处理别的事，过一会儿再收。'],
};

async function collect() {
  const amount = cents(), payee = $('payee').value.trim(), memo = $('memo').value.trim();
  try { localStorage.setItem('clawhunt-card-payee', payee); } catch (error) { /* private mode */ }
  $('go').disabled = true;
  let started;
  try {
    const response = await fetch('/api/cards/' + encodeURIComponent(cardId) + '/pay-requests', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({payee, memo, amount: (amount / 100).toFixed(2)}),
    });
    started = await response.json();
    if (!response.ok) {
      const waits = {409: '卡正在处理别的请求，或今天不能再收这么多。过一会儿再试。', 429: '上一笔没有被接受，请稍等再发。'};
      started = {error: waits[response.status] || '没发出去，请检查金额后再试。'};
    }
  } catch (error) {
    started = {error: '网络不通，请再试一次'};
  }
  if (started.error) {
    $('hint').textContent = started.error;
    $('hint').classList.add('bad');
    $('go').disabled = false;
    return;
  }
  $('stage').style.setProperty('--ttl', started.expires_in + 's');
  stage('waiting', '请持卡人确认', money(amount), '卡上已经响铃。按 OK 付款，按上下键拒绝。', started.match_code);
  for (;;) {
    // 2 s keeps one waiting page well under the site's limit of 60 requests a minute per address.
    await new Promise(resolve => setTimeout(resolve, 2000));
    let pay;
    try {
      const response = await fetch('/api/cards/pay-requests/' + encodeURIComponent(started.ref));
      if (!response.ok) continue;
      pay = await response.json();
    } catch (error) { continue; }
    if (pay.status === 'pending') continue;
    if (pay.status === 'approved') {
      stage('paid', '持卡人已确认', money(amount), `${card.agent.name} 在卡上按了 OK。试运行期间不扣款。`);
      receipt([['付款方', `${card.agent.name}（agent #${card.agent.id}）`], ['收款方', payee], ['备注', memo || '无'],
        ['核对码', started.match_code], ['单号', started.ref.slice(0, 10)], ['时间', new Date().toLocaleString('zh-CN')]]);
    } else {
      const reason = pay.status === 'declined' ? (pay.decline_reason || 'declined') : pay.status;
      const [title, detail] = FAILURES[reason] || FAILURES.declined;
      stage('failed', title, money(amount), detail);
    }
    break;
  }
  load();
}

$('go').addEventListener('click', collect);
$('again').addEventListener('click', () => {
  digits = '';
  document.body.dataset.state = 'entry';
  $('stage').hidden = true;
  $('entry').hidden = false;
  refresh();
});
$('payee').addEventListener('input', refresh);
try { $('payee').value = localStorage.getItem('clawhunt-card-payee') || ''; } catch (error) { /* private mode */ }
drawPad();
load();
setInterval(() => { if (!$('entry').hidden) load(); }, 15000);
</script>
</body>
</html>
